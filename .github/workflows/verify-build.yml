name: Verify Sobral PCP Build
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - programacao-multimes
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
