name: Verify Sobral PCP Build
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'lib/permissions.ts'
      - 'lib/ia/knowledge.ts'
      - 'app/api/ia/conhecimento/**'
      - 'app/(erp)/sobral-ia/**'
      - 'public/sobral-s.svg'
      - 'app/api/inteligencia/**'
      - 'app/(erp)/dashboard/page.tsx'
      - 'app/(erp)/lideres/page.tsx'
      - 'components/erp-shell.tsx'
      - 'components/brand-logo.tsx'
      - 'app/login/page.tsx'
      - 'app/icon.svg'
      - 'app/layout.tsx'
      - 'app/styles/tokens.css'
      - 'app/globals.css'
      - 'package.json'
      - 'app/api/ia/**'
      - 'lib/ia/**'
      - 'components/ai-assistant.tsx'
      - 'lib/romaneio/**'
      - 'app/api/romaneios/**'
      - 'app/(erp)/romaneios/**'
      - 'app/api/programacoes/route.ts'
      - 'app/(erp)/programacao/page.tsx'
      - 'database/schema.sql'
      - '.github/workflows/verify-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit lockfile if updated
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for Vercel AI Gateway"
          git push
