<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sobral · Apontamento sem conexão</title><style>body{font:18px system-ui;max-width:600px;margin:30px auto;padding:16px;background:#f6f8fb;color:#152d4c}label{display:block;margin:16px 0}input,button{display:block;font:inherit;padding:14px;width:100%;box-sizing:border-box}button{background:#152d4c;color:white;border:0;border-radius:8px}#msg{white-space:pre-wrap}</style><h1>Apontamento sem conexão</h1><p id="contexto">Verificando usuário e unidade deste dispositivo…</p><p>Os lançamentos serão conferidos no servidor quando você voltar ao sistema e reenviar a fila. Operações com consumo manual precisam da tela conectada.</p><form id="form"><label>Operação / QR<input name="op" required placeholder="OP:UUID"></label><label>Quantidade boa<input name="boa" type="number" min="0" step="0.001" required></label><label>Refugo<input name="refugo" type="number" min="0" step="0.001" value="0" required></label><label>Motivo do refugo<input name="motivo" maxlength="200"></label><button>Guardar neste dispositivo</button></form><p id="msg" role="status"></p><p><a href="/apontamento-operacoes">Voltar ao sistema e reenviar</a></p><script>
let db,ctx;const msg=document.querySelector('#msg'),form=document.querySelector('#form');form.querySelector('button').disabled=true;
const r=indexedDB.open('erp-chao-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('fila',{keyPath:'requestId'});r.result.createObjectStore('contexto',{keyPath:'id'});};r.onsuccess=()=>{db=r.result;const q=db.transaction('contexto').objectStore('contexto').get('atual');q.onsuccess=()=>{ctx=q.result;document.querySelector('#contexto').textContent=ctx?'Login de origem: '+ctx.usuario+' · unidade '+ctx.unidade:'Abra o sistema conectado antes de usar este modo.';form.querySelector('button').disabled=!ctx;};};r.onerror=()=>msg.textContent='Armazenamento local indisponível.';
form.addEventListener('submit',e=>{e.preventDefault();if(!ctx)return;const f=new FormData(form),operacaoId=String(f.get('op')).replace(/^OP:/,''),boa=Number(f.get('boa')),refugo=Number(f.get('refugo')),motivo=String(f.get('motivo')||'');if(!/^[0-9a-f-]{36}$/i.test(operacaoId)||boa+refugo<=0||(refugo>0&&!motivo)){msg.textContent='Confira operação, quantidades e motivo do refugo.';return;}const requestId=crypto.randomUUID(),body={action:'CICLO_APONTAR',requestId,payload:{boa,refugo,motivo,setupMin:0,maquinaMin:0,turno:'',lote:'',serie:'',consumirRefugo:true,consumos:[]}},tx=db.transaction('fila','readwrite');tx.objectStore('fila').put({requestId,usuario:ctx.usuario,unidade:ctx.unidade,operacaoId,body,criadoEm:Date.now()});tx.oncomplete=()=>{msg.textContent='Lançamento guardado. Volte ao sistema com o mesmo login e unidade para reenviar.';form.reset();};tx.onerror=()=>msg.textContent='Não foi possível guardar. Nenhum envio foi confirmado.';});
</script></html>
